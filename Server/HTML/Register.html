<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASCII Clash — New Player</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="container">
  <a href="/index.html" class="nav-back">◀ BACK TO LOGIN</a>
  <h1>New Player</h1>

  <div class="msg-error" id="err"></div>

  <form id="regForm">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username"
             autocomplete="username" spellcheck="false" required maxlength="15">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password"
             autocomplete="new-password" required>
    </div>
    <div class="field">
      <label for="confirm">Confirm Password</label>
      <input type="password" id="confirm" name="confirm"
             autocomplete="new-password" required>
    </div>
    <button type="submit" class="btn-primary" id="btnRegister">[ REGISTER ]</button>
  </form>

  <div class="msg-info">
    !! This is a small test project — NOT secure.<br>
    Do NOT use real or sensitive data.
  </div>
</div>

<script src="/utils.js"></script>
<script>
  const form = document.getElementById('regForm');
  const err  = document.getElementById('err');
  const btn  = document.getElementById('btnRegister');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideMsg(err);

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const confirm  = document.getElementById('confirm').value;

    if (password !== confirm) {
      showError(err, 'Passwords do not match');
      shake(form);
      return;
    }

    btn.disabled = true;

    const regRes = await postForm('/Register', { username, password });
    if (!regRes) { btn.disabled = false; return; }

    if (!regRes.ok) {
      const msg = await regRes.text();
      showError(err, msg || 'Registration failed');
      shake(form);
      btn.disabled = false;
      return;
    }

    const loginRes = await postForm('/Login', { username, password });
    if (!loginRes) { btn.disabled = false; return; }

    if (loginRes.ok) {
      window.location.href = '/Home.html';
    } else {
      const msg = await loginRes.text();
      showError(err, msg || 'Registered but login failed — please log in manually');
      shake(form);
      btn.disabled = false;
    }
  });
</script>
</body>
</html>

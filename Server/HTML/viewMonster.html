<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASCII Clash — Monster</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <a href="/team.html" class="nav-back">◀ BACK</a>
    <div id="loadingMsg" class="loading">loading...</div>
    <div id="content" style="display:none"></div>
  </div>

  <!-- Fixed tooltip — lives outside container so it can overlay freely -->
  <div class="tooltip" id="tooltip"></div>

  <script src="/utils.js"></script>
  <script>
    // ── Init ────────────────────────────────────────────────
    const params    = new URLSearchParams(location.search);
    const monsterId = params.get('id');
    if (!monsterId) { location.href = '/team.html'; }

    const tooltip = document.getElementById('tooltip');
    const content = document.getElementById('content');

    const SKIP = new Set(['id', 'name', 'type', 'level', 'exp', 'skillpoints']);

    let monster   = null;   // live monster object (updated on apply)
    let gameStats = null;   // { StatName: { Default, Description, LevelUp } }
    let pending   = {};     // { StatName: timesLeveledUp } — reset after apply

    // ── Load data ────────────────────────────────────────────
    async function init() {
      const [statsRes, monsterRes] = await Promise.all([
        post('/about/game?key=Stats'),
        post('/getMonster?id=' + monsterId),
      ]);

      if (!statsRes || !monsterRes || !statsRes.ok || !monsterRes.ok) {
        location.href = '/team.html';
        return;
      }

      const statsData   = await statsRes.json();
      const monsterData = await monsterRes.json();

      gameStats = statsData;
      monster   = monsterData.find(m => m !== null);
      if (!monster) { location.href = '/team.html'; return; }

      document.title = `ASCII Clash — ${monster.name}`;

      // Initialise pending map for all levelable stats
      for (const [statName, info] of Object.entries(gameStats)) {
        if (info.LevelUp > 0) pending[statName] = 0;
      }

      document.getElementById('loadingMsg').style.display = 'none';
      content.style.display = 'block';
      render();
    }

    // ── Helpers ──────────────────────────────────────────────
    function getPool() {
      return monster.skillpoints - Object.values(pending).reduce((a, b) => a + b, 0);
    }

    function hasPending() {
      return Object.values(pending).some(v => v > 0);
    }

    // ── Full re-render ────────────────────────────────────────
    function render() {
      content.innerHTML = '';

      // ── Header ──
      const header = document.createElement('div');
      header.className = 'monster-header';
      header.innerHTML = `
        <img class="monster-header-img"
             src="/images/${encodeURIComponent(monster.type)}.png"
             alt="${monster.type}"
             onerror="this.src='/images/NA.png'">
        <div class="monster-header-info">
          <div class="monster-name">${monster.name}</div>
          <div class="monster-type-lv">${monster.type} · LV.${monster.level}</div>
        </div>
      `;
      content.appendChild(header);

      // ── EXP bar ──
      const expMax = monster.level * 2;
      const expPct = Math.min((monster.exp / expMax) * 100, 100).toFixed(1);
      appendBar(content, 'EXP', `${monster.exp} / ${expMax}`, expPct, '');

      // ── Skill-points bar ──
      const pool   = getPool();
      const spPct  = monster.skillpoints > 0
        ? Math.max(0, (pool / monster.skillpoints) * 100).toFixed(1)
        : '0';
      appendBar(content, 'Skill Points', `${pool} / ${monster.skillpoints}`, spPct, 'sp-fill',
                'spCount', 'spFill');

      // ── Levelable stats ──
      const lvSection = document.createElement('div');
      lvSection.className = 'stats-section';
      lvSection.innerHTML = '<div class="section-label">Stats</div>';

      const errBox = document.createElement('div');
      errBox.className = 'msg-error';
      errBox.id = 'statErr';
      lvSection.appendChild(errBox);

      for (const [statName, info] of Object.entries(gameStats)) {
        const key = statName.toLowerCase();
        if (SKIP.has(key) || !(key in monster) || info.LevelUp <= 0) continue;

        const curVal = monster[key] + pending[statName] * info.LevelUp;

        const row = document.createElement('div');
        row.className = 'stat-row';
        row.dataset.tip  = info.Description;
        row.dataset.stat = statName;

        const hasDelta = pending[statName] > 0;

        row.innerHTML = `
          <span class="stat-label">${statName}</span>
          <button class="btn-small" data-action="minus" data-stat="${statName}"
                  aria-label="decrease ${statName}"
                  ${pending[statName] <= 0 ? 'disabled' : ''}>−</button>
          <span class="stat-value" id="val-${statName}">${curVal}</span>
          <button class="btn-small" data-action="plus" data-stat="${statName}"
                  aria-label="increase ${statName}"
                  ${getPool() <= 0 ? 'disabled' : ''}>+</button>
          <span class="stat-delta${hasDelta ? ' visible' : ''}" id="delta-${statName}">
            ${hasDelta ? '+' + (pending[statName] * info.LevelUp) : ''}
          </span>
        `;

        attachTooltip(row);
        lvSection.appendChild(row);
      }

      content.appendChild(lvSection);

      // ── Apply button ──
      const applyRow = document.createElement('div');
      applyRow.className = 'apply-row';
      const applyBtn = document.createElement('button');
      applyBtn.className = 'btn-primary';
      applyBtn.id        = 'btnApply';
      applyBtn.disabled  = !hasPending();
      applyBtn.textContent = '[ APPLY ]';
      applyRow.appendChild(applyBtn);
      content.appendChild(applyRow);

      // ── Read-only stats ──
      const roSection = document.createElement('div');
      roSection.className = 'stats-section';
      roSection.innerHTML = '<div class="section-label">Info</div>';

      // skillpoints — live (updated by updatePool())
      const spRow = document.createElement('div');
      spRow.className = 'stat-row readonly';
      spRow.innerHTML = `
        <span class="stat-label">skillpoints</span>
        <span class="stat-value" id="spStatVal">${pool}</span>
      `;
      roSection.appendChild(spRow);

      // level + exp from monster
      [['level', monster.level], ['exp', monster.exp]].forEach(([name, val]) => {
        const row = document.createElement('div');
        row.className = 'stat-row readonly';
        row.innerHTML = `
          <span class="stat-label">${name}</span>
          <span class="stat-value">${val}</span>
        `;
        roSection.appendChild(row);
      });

      // gameStats entries where LevelUp === 0
      for (const [statName, info] of Object.entries(gameStats)) {
        const key = statName.toLowerCase();
        if (SKIP.has(key) || !(key in monster) || info.LevelUp !== 0) continue;

        const row = document.createElement('div');
        row.className = 'stat-row readonly';
        row.dataset.tip = info.Description;
        row.innerHTML = `
          <span class="stat-label">${statName}</span>
          <span class="stat-value">${monster[key]}</span>
        `;
        attachTooltip(row);
        roSection.appendChild(row);
      }

      content.appendChild(roSection);

      // ── Delete ──
      const sep = document.createElement('hr');
      sep.className = 'sep';
      content.appendChild(sep);

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'btn-danger';
      deleteBtn.textContent = '[ DELETE MONSTER ]';
      content.appendChild(deleteBtn);

      // Wire up interactions
      wireStatButtons(lvSection);
      wireApply(applyBtn, errBox);
      wireDelete(deleteBtn);
    }

    // ── Helpers: bars ────────────────────────────────────────
    function appendBar(parent, label, valText, pct, fillClass, countId, fillId) {
      const row = document.createElement('div');
      row.className = 'bar-row';
      row.innerHTML = `
        <div class="bar-label">
          <span>${label}</span>
          <strong${countId ? ` id="${countId}"` : ''}>${valText}</strong>
        </div>
        <div class="progress-bar">
          <div class="progress-fill${fillClass ? ' ' + fillClass : ''}"
               ${fillId ? `id="${fillId}"` : ''}
               style="width:${pct}%"></div>
        </div>
      `;
      parent.appendChild(row);
    }

    // ── Update skill-point display without full re-render ────
    function updatePool() {
      const pool = getPool();
      const pct  = monster.skillpoints > 0
        ? Math.max(0, (pool / monster.skillpoints) * 100)
        : 0;

      const countEl = document.getElementById('spCount');
      const fillEl  = document.getElementById('spFill');
      const statEl  = document.getElementById('spStatVal');

      if (countEl) countEl.textContent = `${pool} / ${monster.skillpoints}`;
      if (fillEl)  fillEl.style.width  = pct + '%';
      if (statEl)  statEl.textContent  = pool;
    }

    // ── Stat +/− button handling (event delegation) ──────────
    function wireStatButtons(section) {
      section.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-action]');
        if (!btn || btn.disabled) return;

        const statName = btn.dataset.stat;
        const info     = gameStats[statName];
        const action   = btn.dataset.action;

        if (action === 'plus') {
          if (getPool() <= 0) return;
          pending[statName]++;
        } else {
          if (pending[statName] <= 0) return;
          pending[statName]--;
        }

        // Update value display
        const baseVal  = monster[statName.toLowerCase()];
        const newVal   = baseVal + pending[statName] * info.LevelUp;
        const valEl    = document.getElementById('val-' + statName);
        const deltaEl  = document.getElementById('delta-' + statName);

        if (valEl) valEl.textContent = newVal;

        if (deltaEl) {
          if (pending[statName] > 0) {
            deltaEl.textContent = '+' + (pending[statName] * info.LevelUp);
            deltaEl.classList.add('visible');
          } else {
            deltaEl.textContent = '';
            deltaEl.classList.remove('visible');
          }
        }

        // Refresh disabled state
        const minusBtn = section.querySelector(`[data-action="minus"][data-stat="${statName}"]`);
        if (minusBtn) minusBtn.disabled = pending[statName] <= 0;

        const pool = getPool();
        section.querySelectorAll('[data-action="plus"]').forEach(b => { b.disabled = pool <= 0; });

        updatePool();

        const applyBtn = document.getElementById('btnApply');
        if (applyBtn) applyBtn.disabled = !hasPending();
      });
    }

    // ── Apply button ─────────────────────────────────────────
    function wireApply(btn, errBox) {
      btn.addEventListener('click', async () => {
        if (!hasPending()) return;
        hideMsg(errBox);
        btn.disabled = true;

        // Build payload: only stats with pending > 0
        const body = {};
        for (const [k, v] of Object.entries(pending)) {
          if (v > 0) body[k] = v;
        }

        const res = await postJSON('/levelMonster?id=' + monsterId, body);
        if (!res) { btn.disabled = false; return; }

        if (res.ok) {
          // Rebase local state
          for (const [statName, times] of Object.entries(body)) {
            const info = gameStats[statName];
            monster[statName.toLowerCase()] += times * info.LevelUp;
          }
          const spent = Object.values(body).reduce((a, b) => a + b, 0);
          monster.skillpoints -= spent;
          for (const k in pending) pending[k] = 0;
          render();
        } else {
          const msg = await res.text();
          showError(errBox, msg || 'Failed to apply changes');
          for (const k in pending) pending[k] = 0;
          render();
        }
      });
    }

    // ── Delete button (two-click confirm + 4s timer) ─────────
    let deleteStage = 0;
    let deleteTimer = null;

    function wireDelete(btn) {
      deleteStage = 0;
      clearTimeout(deleteTimer);

      btn.addEventListener('click', async () => {
        if (deleteStage === 0) {
          deleteStage = 1;
          btn.textContent = '[ CONFIRM DELETE? ]';
          clearTimeout(deleteTimer);
          deleteTimer = setTimeout(() => {
            deleteStage = 0;
            btn.textContent = '[ DELETE MONSTER ]';
          }, 4000);
        } else {
          clearTimeout(deleteTimer);
          const res = await post('/deleteMonster?id=' + monsterId);
          if (!res) return;
          if (res.ok) location.href = '/team.html';
        }
      });
    }

    // ── Tooltip (hover + tap) ─────────────────────────────────
    function attachTooltip(row) {
      const tip = row.dataset.tip;
      if (!tip) return;

      row.addEventListener('mouseenter', () => {
        tooltip.textContent = tip;
        tooltip.style.display = 'block';
      });

      row.addEventListener('mousemove', (e) => {
        const tw = tooltip.offsetWidth;
        const th = tooltip.offsetHeight;
        let x = e.clientX + 14;
        let y = e.clientY - th - 10;
        x = Math.min(x, window.innerWidth  - tw - 8);
        y = Math.max(y, 8);
        tooltip.style.left = x + 'px';
        tooltip.style.top  = y + 'px';
      });

      row.addEventListener('mouseleave', () => {
        tooltip.style.display = 'none';
      });

      row.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        tooltip.textContent = tip;
        let x = Math.min(touch.clientX, window.innerWidth - 230);
        let y = touch.clientY - 72;
        y = Math.max(y, 8);
        tooltip.style.left = x + 'px';
        tooltip.style.top  = y + 'px';
        tooltip.style.display = 'block';
      }, { passive: true });

      row.addEventListener('touchend', () => {
        setTimeout(() => { tooltip.style.display = 'none'; }, 1500);
      });
    }

    init();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Clash — Leaderboard</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        /* ── Retro arcade header ── */
        .arcade-frame {
            border: 2px solid var(--dim);
            background: #000;
            text-align: center;
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .arcade-frame::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                    0deg, transparent, transparent 3px,
                    rgba(0, 255, 65, 0.025) 3px, rgba(0, 255, 65, 0.025) 4px
            );
            pointer-events: none;
        }

        .arcade-frame-top {
            background: var(--dim);
            padding: 0.3rem 0.5rem;
            font-size: 0.4rem;
            color: #000;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            position: relative;
            z-index: 1;
        }

        .arcade-frame-body {
            padding: 0.75rem 1rem 0.5rem;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 1rem;
            letter-spacing: 0.15em;
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .arcade-tagline {
            font-size: 0.4rem;
            color: var(--dim);
            letter-spacing: 0.15em;
            margin-top: 0.3rem;
            display: block;
        }

        .arcade-frame-foot {
            font-size: 0.38rem;
            color: var(--dim);
            padding: 0.3rem 0.5rem;
            border-top: 1px solid rgba(0, 122, 31, 0.25);
            letter-spacing: 0.2em;
            animation: blink 1.4s step-end infinite;
            position: relative;
            z-index: 1;
        }

        /* ── You-status bar ── */
        .you-status {
            font-size: 0.45rem;
            color: var(--green);
            background: rgba(0, 255, 65, 0.06);
            border: 1px solid var(--dim);
            padding: 0.45rem 0.6rem;
            margin-bottom: 1rem;
            text-align: center;
            display: none;
        }

        /* ── Table header ── */
        .lb-head {
            display: flex;
            gap: 0.5rem;
            padding: 0.3rem 0.6rem;
            font-size: 0.38rem;
            color: var(--dim);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            border-bottom: 1px solid rgba(0, 122, 31, 0.3);
            margin-bottom: 0.35rem;
        }

        .lb-head .lb-rank {
            min-width: 1.5rem;
        }

        .lb-head .lb-medal {
            width: 1.2rem;
        }

        .lb-head .lb-name {
            flex: 1;
        }

        .lb-head .lb-score {
            min-width: 4.5rem;
            text-align: right;
        }
    </style>
</head>
<body>
<div class="container">
    <a href="/home.html" class="nav-back">◀ BACK</a>

    <div class="arcade-frame">
        <div class="arcade-frame-top">── HALL OF FAME ──</div>
        <div class="arcade-frame-body">
            <h1>TOP SCORES</h1>
            <span class="arcade-tagline"> -- TOP PLAYERS -- </span>
        </div>
        <div class="arcade-frame-foot">▶ SOMEONE ELSE MIGHT BE BETTER... ◀</div>
    </div>

    <div class="you-status" id="youStatus"></div>

    <div class="lb-head">
        <span class="lb-rank">#</span>
        <span class="lb-medal"></span>
        <span class="lb-name">PLAYER</span>
        <span class="lb-score">SCORE</span>
    </div>

    <div id="lbList" class="loading">loading...</div>
</div>

<script src="/utils.js"></script>
<script>

    async function init() {
        // Fetch leaderboard + current user in parallel
        const [lbRes, meRes] = await Promise.all([
            post('/leaderBoard'),
            post('/about/me'),
        ]);

        const rows = (lbRes && lbRes.ok) ? await lbRes.json() : [];
        const meData = (meRes && meRes.ok) ? await meRes.json() : null;
        const me = meData?.Username ?? null;

        const list = document.getElementById('lbList');
        const youStatus = document.getElementById('youStatus');

        list.className = '';
        list.innerHTML = '';

        if (rows.length === 0) {
            list.innerHTML = `
          <div style="text-align:center;font-size:0.5rem;color:var(--dim);padding:1.5rem 0">
            NO SCORES YET
          </div>`;
            return;
        }

        let myRank = null, myScore = null;

        rows.forEach((entry, i) => {
            const rank = i + 1;
            const isMe = me && entry.username === me;
            if (isMe) {
                myRank = rank;
                myScore = entry.score;
            }

            const row = document.createElement('div');
            row.className = 'lb-rank-row'
                + (rank <= 3 ? ` rank-${rank}` : '')
                + (isMe ? ' current-user' : '');

            const youTag = isMe ? '<span class="lb-you-tag">&lt;-- you</span>' : '';

            row.innerHTML = `
          <span class="lb-rank">#${rank}</span>
          <span class="lb-name">${entry.username}${youTag}</span>
          <span class="lb-score">${String(entry.score).padStart(6, '0')}</span>
        `;
            list.appendChild(row);
        });

        if (myRank !== null) {
            youStatus.textContent = `> you are #${myRank} with ${myScore} points`;
            youStatus.style.display = 'block';
        }
    }

    init();
</script>
</body>
</html>

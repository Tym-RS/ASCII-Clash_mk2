<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Clash — Leaderboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .lb-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0.8rem;
            margin-bottom: 0.4rem;
            border: 1px solid #0d1f0d;
            background: #0a0a0a;
            font-size: 0.55rem;
        }

        .lb-row.rank-1 { border-color: #ffd700; color: #ffd700; background: #100f00; }
        .lb-row.rank-2 { border-color: #c0c0c0; color: #c0c0c0; background: #0d0d0d; }
        .lb-row.rank-3 { border-color: #cd7f32; color: #cd7f32; background: #0f0900; }

        .lb-row.is-me {
            border-color: var(--green);
            background: #001a00;
        }

        .lb-rank  { width: 3.2rem; flex-shrink: 0; white-space: nowrap; color: inherit; }
        .lb-name  { flex: 1; padding: 0 0.6rem; color: inherit; }
        .lb-score { color: inherit; }

        .lb-you-tag {
            font-size: 0.42rem;
            color: var(--green);
            margin-left: 0.5rem;
            opacity: 0.7;
        }

        .lb-status {
            font-size: 0.65rem;
            color: var(--dim);
            margin-bottom: 1.4rem;
            padding: 0.7rem 0.8rem;
            border: 1px solid #0d1f0d;
            background: #050f05;
            line-height: 2.2;
        }
    </style>
</head>
<body>
<div class="container">

    <form action="home.html" style="margin-bottom:1.5rem;">
        <input type="submit" value="back">
    </form>

    <h1>Leaderboard</h1>

    <div id="you-status" class="lb-status" style="display:none;"></div>
    <div id="error-msg" class="msg-error" style="display:none;"></div>
    <div id="lb-list"></div>

</div>

<script type="module">
    const username = sessionStorage.getItem('username');

    async function load() {
        const errorBox  = document.getElementById('error-msg');
        const list      = document.getElementById('lb-list');
        const youStatus = document.getElementById('you-status');

        try {
            const res = await fetch('/leaderBoard', { method: 'POST' });
            if (!res.ok) { errorBox.textContent = '> failed to load leaderboard'; errorBox.style.display = 'block'; return; }

            const data = await res.json();

            list.innerHTML = '';

            let myPlace = null;
            let myScore = null;

            data.forEach((entry, i) => {
                const rank = i + 1;
                const isMe = username && entry.username === username;

                if (isMe) { myPlace = rank; myScore = entry.score; }

                const row = document.createElement('div');
                row.className = 'lb-row';
                if (rank === 1) row.classList.add('rank-1');
                else if (rank === 2) row.classList.add('rank-2');
                else if (rank === 3) row.classList.add('rank-3');
                if (isMe) row.classList.add('is-me');

                const medal = rank === 1 ? '[ 1 ]' : rank === 2 ? '[ 2 ]' : rank === 3 ? '[ 3 ]' : `  ${rank} `;

                row.innerHTML = `
                    <span class="lb-rank">${medal}</span>
                    <span class="lb-name">${entry.username}${isMe ? '<span class="lb-you-tag">&lt;-- you</span>' : ''}</span>
                    <span class="lb-score">${entry.score}</span>
                `;
                list.appendChild(row);
            });

            if (myPlace !== null) {
                youStatus.textContent = `> you are #${myPlace} with ${myScore} points`;
                youStatus.style.display = 'block';
            }

        } catch {
            errorBox.textContent = '> network error';
            errorBox.style.display = 'block';
        }
    }

    load();
</script>
</body>
</html>

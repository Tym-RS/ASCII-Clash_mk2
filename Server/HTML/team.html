<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASCII Clash — Your Team</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <a href="/home.html" class="nav-back">◀ BACK</a>
    <h1>Your Team</h1>

    <div id="teamList" class="loading">loading...</div>

    <div style="margin-top:1.25rem">
      <button class="btn-primary" id="btnRun" disabled>[ NEW RUN ]</button>
      <p class="hint-text" id="runHint"></p>
    </div>
  </div>

  <script src="/utils.js"></script>
  <script>
    // Stat keys that are not displayed in the mini stats grid
    const SKIP = new Set(['id', 'name', 'type', 'level', 'exp', 'skillpoints']);

    async function init() {
      const res = await post('/getMonster');
      if (!res || !res.ok) return;
      const slots = await res.json();
      render(slots);
    }

    function render(slots) {
      const list = document.getElementById('teamList');
      list.className = '';
      list.innerHTML = '';

      const allFilled = slots.length > 0 && slots.every(s => s !== null);

      slots.forEach((monster) => {
        const banner = document.createElement('div');

        if (!monster) {
          banner.className = 'monster-banner empty';
          banner.innerHTML = `
            <img class="monster-img" src="/images/NA.png" alt="empty slot">
            <span class="empty-slot-text">[ empty slot ]</span>
          `;
          banner.addEventListener('click', () => location.href = '/createMonster.html');
        } else {
          banner.className = 'monster-banner';

          // Build mini-stats (everything except SKIP keys)
          const statEntries = Object.entries(monster).filter(([k]) => !SKIP.has(k));
          const statsHtml = statEntries
            .map(([k, v]) => `<div class="stats-mini-item">${k}:<b>${v}</b></div>`)
            .join('');

          const spBadge = monster.skillpoints > 0
            ? `<div class="sp-badge">+${monster.skillpoints} SP</div>`
            : '';

          banner.innerHTML = `
            <img class="monster-img"
                 src="/images/${encodeURIComponent(monster.type)}.png"
                 alt="${monster.type}"
                 onerror="this.src='/images/NA.png'">
            <div class="monster-info">
              <div class="monster-name">${monster.name}</div>
              <div class="monster-type-lv">${monster.type} · LV.${monster.level}</div>
              <div class="monster-exp">EXP: ${monster.exp} / ${monster.level * 2}</div>
              ${spBadge}
              <div class="stats-mini">${statsHtml}</div>
            </div>
          `;
          banner.addEventListener('click', () => location.href = `/viewMonster.html?id=${monster.id}`);
        }

        list.appendChild(banner);
      });

      // "New Run" button state
      const runBtn  = document.getElementById('btnRun');
      const runHint = document.getElementById('runHint');
      runBtn.disabled = !allFilled;
      runHint.textContent = allFilled ? '' : '> all slots must be filled to start a run';

      runBtn.onclick = async () => {
        if (runBtn.disabled) return;
        await post('/startRun'); // server currently returns 501
      };
    }

    init();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASCII Clash — Fight</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    /* ── Winner banner ── */
    .winner-banner {
      border: 2px solid var(--green);
      background: rgba(0, 255, 65, 0.06);
      text-align: center;
      padding: 1rem;
      margin-bottom: 1rem;
    }

    .winner-title {
      font-size: 0.8rem;
      color: var(--green);
      margin-bottom: 0.4rem;
      text-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
    }

    .winner-sub {
      font-size: 0.42rem;
      color: var(--dim);
      animation: blink 1.3s step-end infinite;
    }

    /* ── Turn indicator ── */
    .turn-indicator {
      font-size: 0.45rem;
      color: var(--dim);
      text-align: center;
      padding: 0.5rem;
      margin-bottom: 0.75rem;
      border: 1px solid rgba(0, 122, 31, 0.25);
    }

    .turn-indicator.your-turn {
      color: var(--green);
      border-color: var(--green);
      animation: blink 1s step-end infinite;
    }

    /* ── Participants ── */
    .participants {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .team-block {
      border: 2px solid var(--dim);
      background: rgba(0, 0, 0, 0.4);
      padding: 0.75rem;
    }

    .team-block.my-team { border-color: rgba(0, 122, 31, 0.5); }
    .team-block.active-team { border-color: var(--green); }

    .team-block-name {
      font-size: 0.55rem;
      color: var(--green);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .team-block-name.enemy { color: var(--dim); }

    .autofight-toggle {
      font-size: 0.38rem;
      background: transparent;
      border: 1px solid var(--dim);
      color: var(--dim);
      font-family: 'Press Start 2P', monospace;
      padding: 0.2rem 0.4rem;
      cursor: pointer;
      min-height: 28px;
      transition: color 0.15s, border-color 0.15s;
    }

    .autofight-toggle.on {
      color: var(--green);
      border-color: var(--green);
    }

    /* ── Monster row in fight ── */
    .fight-mon-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.4rem 0;
      border-bottom: 1px solid rgba(0, 122, 31, 0.1);
      cursor: default;
    }

    .fight-mon-row.dead { opacity: 0.3; }

    .fight-mon-row.selectable {
      cursor: pointer;
      transition: background 0.12s;
    }

    .fight-mon-row.selectable:hover { background: rgba(0, 122, 31, 0.06); }

    .fight-mon-row.selected-atk { background: rgba(0, 255, 65, 0.1); }
    .fight-mon-row.selected-def { background: rgba(255, 50, 50, 0.08); }

    .fight-mon-img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      image-rendering: pixelated;
      flex-shrink: 0;
    }

    .fight-mon-info { flex: 1; min-width: 0; }

    .fight-mon-name {
      font-size: 0.45rem;
      color: var(--text);
      margin-bottom: 0.2rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .fight-mon-name.dead-name { color: var(--dim); }

    .hp-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.35rem;
      color: var(--dim);
      margin-bottom: 0.15rem;
    }

    .progress-bar {
      height: 5px;
      background: rgba(0, 122, 31, 0.15);
      border: 1px solid rgba(0, 122, 31, 0.25);
    }

    .progress-fill { height: 100%; background: var(--green); transition: width 0.3s ease; }
    .progress-fill.low  { background: #ffe000; }
    .progress-fill.crit { background: var(--red); }

    /* ── Action panel ── */
    .action-panel {
      border: 2px solid var(--green);
      background: rgba(0, 122, 31, 0.04);
      padding: 0.85rem;
      margin-bottom: 1rem;
    }

    .action-title {
      font-size: 0.45rem;
      color: var(--green);
      margin-bottom: 0.75rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid rgba(0, 122, 31, 0.3);
    }

    .action-hint {
      font-size: 0.38rem;
      color: var(--dim);
      margin-bottom: 0.5rem;
    }

    .msg-error { margin-bottom: 0.5rem; }

    /* ── Log ── */
    .log-section {
      margin-top: 1rem;
    }

    .log-controls {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 0.6rem;
      flex-wrap: wrap;
    }

    .log-toggle {
      background: transparent;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.38rem;
      border: 1px solid var(--dim);
      color: var(--dim);
      padding: 0.3rem 0.5rem;
      cursor: pointer;
      min-height: 32px;
      transition: color 0.15s, border-color 0.15s;
    }

    .log-toggle.on { color: var(--green); border-color: var(--green); }

    .log-list { display: flex; flex-direction: column; gap: 0.35rem; }

    /* ── Log turn (collapsible) ── */
    .log-turn {
      border: 1px solid rgba(0, 122, 31, 0.2);
      background: rgba(0, 0, 0, 0.3);
    }

    .log-turn-header {
      padding: 0.45rem 0.6rem;
      font-size: 0.42rem;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: background 0.12s;
      user-select: none;
    }

    .log-turn-header:hover { background: rgba(0, 122, 31, 0.06); }

    .log-turn-arrow {
      font-size: 0.38rem;
      color: var(--dim);
      flex-shrink: 0;
      transition: transform 0.15s;
    }

    .log-turn-arrow.open { transform: rotate(90deg); }

    .log-turn-body {
      display: none;
      border-top: 1px solid rgba(0, 122, 31, 0.15);
      padding: 0.4rem 0.6rem;
    }

    .log-turn-body.open { display: block; }

    .log-detail {
      font-size: 0.38rem;
      color: var(--dim);
      padding: 0.2rem 0;
      border-bottom: 1px solid rgba(0, 122, 31, 0.07);
      line-height: 1.8;
    }

    .log-detail.minor { color: rgba(0, 200, 50, 0.6); }
    .log-detail.nerdy { color: rgba(0, 150, 50, 0.45); }
    .log-detail.hidden { display: none; }
  </style>
</head>
<body>
<div class="container">
  <a href="/Play.html" class="nav-back">◀ BACK</a>
  <div id="loadingMsg" class="loading">loading...</div>
  <div id="content" style="display:none"></div>
</div>

<script src="/utils.js"></script>
<script>
  const params  = new URLSearchParams(location.search);
  const fightID = params.get('fight_id');
  const teamID  = parseInt(params.get('team_id'));
  if (!fightID || !teamID) location.href = '/Play.html';

  let pollCount   = 0;
  let pollTimer   = null;
  let showMinor   = true;
  let showNerdy   = false;
  let selectedAtk = null;
  let selectedDef = null;
  let fightData   = null;

  // ── Polling ───────────────────────────────────────────
  function getInterval() {
    if (pollCount < 10) return 1000;
    if (pollCount < 20) return 5000;
    return 10000;
  }

  function schedulePoll() {
    clearTimeout(pollTimer);
    pollTimer = setTimeout(fetchAndRender, getInterval());
  }

  async function fetchAndRender() {
    pollCount++;
    const res = await postForm('/ViewFight', { fight_ID: fightID });
    if (!res || !res.ok) { schedulePoll(); return; }
    fightData = await res.json();

    document.getElementById('loadingMsg').style.display = 'none';
    document.getElementById('content').style.display = 'block';

    render(fightData);

    if (!fightData.is_ongoing) {
      clearTimeout(pollTimer);
      return;
    }

    // Only poll if it's not our turn
    const myTeam = fightData.participants.find(t => t.ID === teamID);
    const isMyTurn = myTeam && fightData.active_team_name === myTeam.name;
    if (!isMyTurn) schedulePoll();
  }

  // ── Render ────────────────────────────────────────────
  function render(fight) {
    const content = document.getElementById('content');
    content.innerHTML = '';

    // Winner banner
    if (!fight.is_ongoing && fight.winner) {
      const isWinner = fight.winner.ID === teamID;
      const banner = document.createElement('div');
      banner.className = 'winner-banner';
      banner.innerHTML = `
          <div class="winner-title">${isWinner ? '>> YOU WIN! <<' : fight.winner.Name + ' WINS'}</div>
          <div class="winner-sub">${isWinner ? 'VICTORY' : 'DEFEAT'}</div>
        `;
      content.appendChild(banner);
    } else if (!fight.is_ongoing) {
      // Draw
      const banner = document.createElement('div');
      banner.className = 'winner-banner';
      banner.innerHTML = `<div class="winner-title">-- DRAW --</div>`;
      content.appendChild(banner);
    }

    // Turn indicator
    const myTeam   = fight.participants.find(t => t.ID === teamID);
    const isMyTurn = myTeam && fight.is_ongoing && fight.active_team_name === myTeam.name;

    const turnEl = document.createElement('div');
    turnEl.className = 'turn-indicator' + (isMyTurn ? ' your-turn' : '');
    turnEl.textContent = isMyTurn
            ? '>> YOUR TURN <<'
            : '> ' + fight.active_team_name + "'s turn";
    content.appendChild(turnEl);

    // Participants
    const parts = document.createElement('div');
    parts.className = 'participants';

    fight.participants.forEach(team => {
      const isMe     = team.ID === teamID;
      const isActive = team.name === fight.active_team_name;

      const block = document.createElement('div');
      block.className = 'team-block'
              + (isMe     ? ' my-team'     : '')
              + (isActive ? ' active-team' : '');

      const nameRow = document.createElement('div');
      nameRow.className = 'team-block-name' + (isMe ? '' : ' enemy');
      nameRow.innerHTML = `<span>${team.name}${isMe ? ' (you)' : ''}</span>`;

      // AutoFight toggle for own team only
      if (isMe && fight.is_ongoing) {
        const af = document.createElement('button');
        af.className   = 'autofight-toggle' + (team.auto_fight ? ' on' : '');
        af.textContent = 'AUTO: ' + (team.auto_fight ? 'ON' : 'OFF');
        af.addEventListener('click', async () => {
          const newVal = team.auto_fight ? 0 : 1;
          const res = await postForm('/SetAutoFight', { team_ID: teamID, set_to: newVal });
          if (res && res.ok) {
            team.auto_fight = newVal === 1;
            af.className   = 'autofight-toggle' + (team.auto_fight ? ' on' : '');
            af.textContent = 'AUTO: ' + (team.auto_fight ? 'ON' : 'OFF');
          }
        });
        nameRow.appendChild(af);
      }

      block.appendChild(nameRow);

      // Monster rows
      team.monsters.forEach(mon => {
        if (!mon) return;
        const alive  = mon.current_health > 0;
        const maxHP  = mon.stats.Health;
        const curHP  = mon.current_health;
        const hpPct  = maxHP > 0 ? Math.max(0, Math.min((curHP / maxHP) * 100, 100)) : 0;
        const fillCls = hpPct <= 25 ? 'crit' : hpPct <= 50 ? 'low' : '';

        const row = document.createElement('div');
        row.className  = 'fight-mon-row' + (alive ? '' : ' dead');
        row.dataset.id = mon.ID;

        row.innerHTML = `
            <img class="fight-mon-img"
                 src="/images/${encodeURIComponent(mon.type)}.png"
                 alt="${mon.type}"
                 onerror="this.src='/images/NA.png'">
            <div class="fight-mon-info">
              <div class="fight-mon-name${alive ? '' : ' dead-name'}">${mon.name}</div>
              <div class="hp-label">
                <span>HP</span><span>${curHP} / ${maxHP}</span>
              </div>
              <div class="progress-bar">
                <div class="progress-fill ${fillCls}" style="width:${hpPct}%"></div>
              </div>
            </div>
          `;

        // Selection for action panel
        if (isMyTurn && alive) {
          if (isMe) {
            row.classList.add('selectable');
            row.addEventListener('click', () => selectAttacker(mon.ID, block));
          } else {
            row.classList.add('selectable');
            row.addEventListener('click', () => selectDefender(mon.ID, block));
          }
        }

        block.appendChild(row);
      });

      parts.appendChild(block);
    });

    content.appendChild(parts);

    // Action panel (only when it's our turn)
    if (isMyTurn) {
      const panel = document.createElement('div');
      panel.className = 'action-panel';
      panel.innerHTML = `
          <div class="action-title">YOUR TURN</div>
          <div class="action-hint">Select attacker from your team, then a target.</div>
          <div class="msg-error" id="actionErr"></div>
          <button class="btn-primary" id="btnSubmit" disabled>[ SUBMIT ]</button>
        `;
      content.appendChild(panel);
      wireSubmit(panel);
    }

    // Log
    renderLog(content, fight.log);
  }

  // ── Monster selection ─────────────────────────────────
  function selectAttacker(id, block) {
    document.querySelectorAll('.fight-mon-row').forEach(r => r.classList.remove('selected-atk'));
    const row = block.querySelector(`[data-id="${id}"]`);
    if (row) row.classList.add('selected-atk');
    selectedAtk = id;
    updateSubmitBtn();
  }

  function selectDefender(id, block) {
    document.querySelectorAll('.fight-mon-row').forEach(r => r.classList.remove('selected-def'));
    const row = block.querySelector(`[data-id="${id}"]`);
    if (row) row.classList.add('selected-def');
    selectedDef = id;
    updateSubmitBtn();
  }

  function updateSubmitBtn() {
    const btn = document.getElementById('btnSubmit');
    if (btn) btn.disabled = !(selectedAtk && selectedDef);
  }

  // ── Submit action ─────────────────────────────────────
  function wireSubmit(panel) {
    panel.querySelector('#btnSubmit').addEventListener('click', async () => {
      const errBox = document.getElementById('actionErr');
      hideMsg(errBox);
      if (!selectedAtk || !selectedDef) return;

      const btn = panel.querySelector('#btnSubmit');
      btn.disabled = true;

      const res = await postForm('/SubmitFightAction', {
        fight_ID:    fightID,
        team_ID:     teamID,
        attacker_ID: selectedAtk,
        defender_ID: selectedDef,
      });

      if (!res || !res.ok) {
        const msg = res ? await res.text() : 'Request failed';
        showError(errBox, msg);
        btn.disabled = false;
        return;
      }

      selectedAtk = null;
      selectedDef = null;
      pollCount   = 0;
      await fetchAndRender();
    });
  }

  // ── Log rendering ─────────────────────────────────────
  function renderLog(parent, log) {
    const section = document.createElement('div');
    section.className = 'log-section';

    const sectionLabel = document.createElement('div');
    sectionLabel.className = 'section-label';
    sectionLabel.textContent = 'Fight Log';
    section.appendChild(sectionLabel);

    // Toggle controls
    const controls = document.createElement('div');
    controls.className = 'log-controls';

    const toggleMinor = document.createElement('button');
    toggleMinor.className  = 'log-toggle' + (showMinor ? ' on' : '');
    toggleMinor.textContent = 'MINOR: ' + (showMinor ? 'ON' : 'OFF');
    toggleMinor.addEventListener('click', () => {
      showMinor = !showMinor;
      toggleMinor.className  = 'log-toggle' + (showMinor ? ' on' : '');
      toggleMinor.textContent = 'MINOR: ' + (showMinor ? 'ON' : 'OFF');
      refreshLogVisibility();
    });

    const toggleNerdy = document.createElement('button');
    toggleNerdy.className  = 'log-toggle' + (showNerdy ? ' on' : '');
    toggleNerdy.textContent = 'NERDY: ' + (showNerdy ? 'ON' : 'OFF');
    toggleNerdy.addEventListener('click', () => {
      showNerdy = !showNerdy;
      toggleNerdy.className  = 'log-toggle' + (showNerdy ? ' on' : '');
      toggleNerdy.textContent = 'NERDY: ' + (showNerdy ? 'ON' : 'OFF');
      refreshLogVisibility();
    });

    controls.appendChild(toggleMinor);
    controls.appendChild(toggleNerdy);
    section.appendChild(controls);

    // Turns (newest last)
    const list = document.createElement('div');
    list.id        = 'logList';
    list.className = 'log-list';

    if (!log || !log.turns || log.turns.length === 0) {
      list.innerHTML = '<div style="font-size:0.42rem;color:var(--dim);padding:0.5rem 0">No log entries yet.</div>';
    } else {
      log.turns.forEach((turn, i) => {
        const turnEl = document.createElement('div');
        turnEl.className = 'log-turn';

        const header = document.createElement('div');
        header.className = 'log-turn-header';
        header.innerHTML = `
            <span class="log-turn-arrow">▶</span>
            <span>Turn ${i + 1}: ${turn.header}</span>
          `;

        const body = document.createElement('div');
        body.className = 'log-turn-body';

        if (turn.details && turn.details.length > 0) {
          turn.details.forEach(detail => {
            const imp = detail.importance ? detail.importance.toLowerCase() : 'minor';
            const el  = document.createElement('div');
            el.className    = 'log-detail ' + imp;
            el.textContent  = detail.header;
            el.dataset.importance = imp;
            body.appendChild(el);

            // Nested details (Nerdy sub-entries)
            if (detail.details && detail.details.length > 0) {
              detail.details.forEach(sub => {
                const subImp = sub.importance ? sub.importance.toLowerCase() : 'nerdy';
                const subEl  = document.createElement('div');
                subEl.className    = 'log-detail ' + subImp;
                subEl.textContent  = '  > ' + sub.header;
                subEl.dataset.importance = subImp;
                body.appendChild(subEl);
              });
            }
          });
        }

        header.addEventListener('click', () => {
          const isOpen = body.classList.toggle('open');
          header.querySelector('.log-turn-arrow').classList.toggle('open', isOpen);
        });

        // Auto-expand latest turn
        if (i === log.turns.length - 1) {
          body.classList.add('open');
          header.querySelector('.log-turn-arrow').classList.add('open');
        }

        turnEl.appendChild(header);
        turnEl.appendChild(body);
        list.appendChild(turnEl);
      });
    }

    section.appendChild(list);
    parent.appendChild(section);

    refreshLogVisibility();
  }

  function refreshLogVisibility() {
    document.querySelectorAll('.log-detail').forEach(el => {
      const imp = el.dataset.importance;
      let visible = true;
      if (imp === 'minor' && !showMinor) visible = false;
      if (imp === 'nerdy' && !showNerdy) visible = false;
      el.classList.toggle('hidden', !visible);
    });
  }

  // ── Start ─────────────────────────────────────────────
  fetchAndRender();
</script>
</body>
</html>

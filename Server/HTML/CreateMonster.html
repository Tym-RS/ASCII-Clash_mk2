<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Clash — New Monster</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        /* ── Carousel ── */
        .carousel-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 0.5rem 0;
        }

        .carousel-wrap {
            flex: 1;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 10rem;
            border: 1px solid var(--dim);
            background: #000;
            position: relative;
        }

        .carousel-card {
            text-align: center;
            padding: 1rem 0.85rem;
            width: 100%;
            animation-duration: 0.18s;
            animation-fill-mode: both;
        }

        .carousel-img {
            width: 4.5rem;
            height: 4.5rem;
            image-rendering: pixelated;
            object-fit: contain;
            display: block;
            margin: 0 auto 0.65rem;
            border: 1px solid rgba(0, 122, 31, 0.3);
        }

        .carousel-name {
            font-size: 0.65rem;
            color: var(--green);
            margin-bottom: 0.35rem;
            text-transform: uppercase;
        }

        .carousel-desc {
            font-size: 0.42rem;
            color: var(--text);
            line-height: 2;
            opacity: 0.72;
        }

        .carousel-dots {
            display: flex;
            gap: 0.35rem;
            justify-content: center;
            margin: 0.5rem 0 0.75rem;
        }

        .carousel-dot {
            width: 8px;
            height: 8px;
            background: var(--dim);
            border: none;
            cursor: pointer;
            padding: 0;
            transition: background 0.15s;
        }

        .carousel-dot.active {
            background: var(--green);
            box-shadow: 0 0 6px rgba(0, 255, 65, 0.6);
        }

        /* ── Keyboard hint ── */
        .kb-hint {
            font-size: 0.38rem;
            color: rgba(0, 122, 31, 0.4);
            text-align: center;
            margin-bottom: 0.75rem;
        }
    </style>
</head>
<body>
<div class="container">
    <a id="backLink" href="/PlayerTeams.html" class="nav-back">◀ BACK</a>
    <h1>New Monster</h1>

    <div id="loadingMsg" class="loading">loading...</div>
    <div id="content" style="display:none">
        <div class="carousel-row">
            <button class="btn-small" id="btnPrev" aria-label="Previous type">◀</button>
            <div class="carousel-wrap">
                <div class="carousel-card" id="carouselCard"></div>
            </div>
            <button class="btn-small" id="btnNext" aria-label="Next type">▶</button>
        </div>

        <div class="carousel-dots" id="carouselDots"></div>
        <div class="kb-hint">◀ ▶ arrow keys to browse</div>

        <div class="field">
            <label for="monsterName">Name</label>
            <input type="text" id="monsterName" name="monsterName"
                   spellcheck="false" maxlength="15" autocomplete="off">
        </div>

        <div class="msg-error" id="err"></div>
        <button class="btn-primary" id="btnCreate">[ CREATE ]</button>
    </div>
</div>

<script src="/utils.js"></script>
<script>
    const params  = new URLSearchParams(location.search);
    const teamID  = params.get('teamID');
    const from    = params.get('from');
    if (!teamID) location.href = '/PlayerTeams.html';

    // Back link propagates the 'from' context
    document.getElementById('backLink').href =
        '/ViewTeam.html?id=' + teamID + (from ? '&from=' + from : '');

    let monsterTypes = [];   // [{ key, desc }]
    let currentIdx   = 0;

    // ── Load types from /GameInfo ─────────────────────────
    async function init() {
        const res = await post('/GameInfo');
        if (!res || !res.ok) {
            location.href = '/ViewTeam.html?id=' + teamID + (from ? '&from=' + from : '');
            return;
        }
        const info = await res.json();
        monsterTypes = Object.entries(info.Monsters || {}).map(([key, desc]) => ({ key, desc }));
        if (monsterTypes.length === 0) {
            location.href = '/ViewTeam.html?id=' + teamID + (from ? '&from=' + from : '');
            return;
        }
        buildDots();
        showCard(0, null);
        document.getElementById('loadingMsg').style.display = 'none';
        document.getElementById('content').style.display    = 'block';
    }

    // ── Dots ──────────────────────────────────────────────
    function buildDots() {
        const dotsWrap = document.getElementById('carouselDots');
        dotsWrap.innerHTML = '';
        monsterTypes.forEach((_, i) => {
            const dot = document.createElement('button');
            dot.className = 'carousel-dot' + (i === 0 ? ' active' : '');
            dot.setAttribute('aria-label', 'Type ' + (i + 1));
            dot.addEventListener('click', () => showCard(i, i < currentIdx ? 'left' : 'right'));
            dotsWrap.appendChild(dot);
        });
    }

    function updateDots() {
        document.querySelectorAll('.carousel-dot').forEach((d, i) => {
            d.classList.toggle('active', i === currentIdx);
        });
    }

    // ── Show card ─────────────────────────────────────────
    function showCard(idx, direction) {
        const card = document.getElementById('carouselCard');
        const type = monsterTypes[idx];

        const animIn  = direction === 'left'  ? 'slideInLeft'  :
            direction === 'right' ? 'slideInRight' : null;

        if (animIn) {
            card.style.animation = '';
            void card.offsetWidth;
        }

        card.innerHTML = `
            <img class="carousel-img"
                 src="/images/${encodeURIComponent(type.key)}.png"
                 alt="${type.key}"
                 onerror="this.src='/images/NA.png'">
            <div class="carousel-name">${type.key}</div>
            <div class="carousel-desc">${type.desc || ''}</div>
        `;

        if (animIn) card.style.animation = `${animIn} 0.18s both`;

        currentIdx = idx;
        updateDots();
    }

    // ── Navigation ────────────────────────────────────────
    function prev() {
        const idx = (currentIdx - 1 + monsterTypes.length) % monsterTypes.length;
        showCard(idx, 'left');
    }

    function next() {
        const idx = (currentIdx + 1) % monsterTypes.length;
        showCard(idx, 'right');
    }

    document.getElementById('btnPrev').addEventListener('click', prev);
    document.getElementById('btnNext').addEventListener('click', next);

    // Keyboard navigation (left/right arrow keys)
    document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;  // don't hijack text input
        if (e.key === 'ArrowLeft')  { e.preventDefault(); prev(); }
        if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
    });

    // ── Create ────────────────────────────────────────────
    const err     = document.getElementById('err');
    const btnCreate = document.getElementById('btnCreate');

    btnCreate.addEventListener('click', async () => {
        hideMsg(err);
        const name = document.getElementById('monsterName').value.trim();
        if (!name) { showError(err, 'Please enter a name'); return; }

        btnCreate.disabled = true;
        const res = await postForm('/CreateMonster', {
            team_ID: teamID,
            name,
            type: monsterTypes[currentIdx].key,
        });

        if (!res) { btnCreate.disabled = false; return; }

        if (res.ok) {
            location.href = '/ViewTeam.html?id=' + teamID + (from ? '&from=' + from : '');
        } else {
            const msg = await res.text();
            showError(err, msg || 'Failed to create monster');
            btnCreate.disabled = false;
        }
    });

    document.getElementById('monsterName').addEventListener('keydown', e => {
        if (e.key === 'Enter') btnCreate.click();
    });

    init();
</script>
</body>
</html>

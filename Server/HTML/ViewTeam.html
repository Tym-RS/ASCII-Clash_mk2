<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Clash — Team</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .title-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid var(--dim);
            flex-wrap: wrap;
        }

        .title-row h1 {
            margin: 0; padding: 0; border: none;
            font-size: 0.85rem;
            flex: 1; min-width: 0;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .title-row h1::after { content: none; }

        .fight-badge {
            font-size: 0.38rem; color: #000;
            background: var(--green);
            padding: 0.3rem 0.45rem;
            letter-spacing: 0.15em; white-space: nowrap;
            animation: blink 1.2s step-end infinite;
            flex-shrink: 0;
        }

        .team-level-line {
            font-size: 0.42rem;
            color: var(--dim);
            margin-bottom: 1rem;
            letter-spacing: 0.1em;
        }

        /* ── Monster cards ── */
        .monster-banner:active { transform: translate(2px, 2px); }

        /* ── HP bar ── */
        .hp-row { display: flex; flex-direction: column; gap: 0.2rem; }
        .hp-label { display: flex; justify-content: space-between; font-size: 0.38rem; color: var(--dim); }
        .progress-fill.low  { background: var(--yellow, #ffe000); }
        .progress-fill.crit { background: var(--red); }

        /* ── AutoFight toggle ── */
        .autofight-row {
            display: flex; align-items: center; justify-content: space-between;
            border: 1px solid var(--dim); padding: 0.6rem 0.75rem; margin-bottom: 0.75rem;
        }

        .autofight-label { font-size: 0.45rem; color: var(--dim); }

        .autofight-btn {
            background: transparent;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.45rem;
            border: 1px solid var(--dim); color: var(--dim);
            padding: 0.35rem 0.6rem; cursor: pointer;
            min-height: calc(36px * var(--scale));
            transition: color 0.15s, border-color 0.15s;
        }

        .autofight-btn.on    { color: var(--green); border-color: var(--green); }
        .autofight-btn:hover { color: var(--text);  border-color: var(--text);  }

        /* ── Fight action buttons ── */
        .fight-actions { margin-bottom: 1rem; }

        .fight-btn-row { display: flex; gap: 0.5rem; }
        .fight-btn-row .btn-primary { flex: 1; font-size: 0.6rem; }

        .btn-lobby {
            flex: 1;
            background: transparent;
            color: var(--green);
            font-family: 'Press Start 2P', monospace;
            font-size: 0.6rem;
            border: 2px solid var(--green);
            padding: 0.9rem 1rem;
            cursor: pointer;
            min-height: calc(48px * var(--scale));
            transition: background 0.15s;
        }

        .btn-lobby:hover { background: rgba(0, 255, 65, 0.07); }
        .btn-lobby:active { transform: translate(2px, 2px); }

        .btn-rejoin {
            width: 100%;
            background: rgba(255, 224, 0, 0.06);
            color: #ffe000;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.6rem;
            border: 2px solid rgba(255, 224, 0, 0.5);
            padding: 0.9rem 1rem;
            cursor: pointer;
            min-height: calc(48px * var(--scale));
            transition: background 0.15s;
        }

        .btn-rejoin:hover { background: rgba(255, 224, 0, 0.12); }

        /* ── Delete ── */
        .delete-wrap { margin-top: 1.5rem; }

        .btn-danger {
            width: 100%; background: transparent;
            color: rgba(0, 122, 31, 0.45);
            font-family: 'Press Start 2P', monospace;
            font-size: 0.5rem;
            border: 1px solid rgba(0, 122, 31, 0.25);
            padding: 0.75rem; cursor: pointer;
            min-height: calc(48px * var(--scale));
            transition: color 0.15s, border-color 0.15s;
        }

        .btn-danger:hover  { color: var(--red); border-color: var(--red); }
        .btn-danger.armed  { color: var(--red); border-color: var(--red); animation: blink 0.6s step-end infinite; }
    </style>
</head>
<body>
<div class="container">
    <a id="backLink" href="/PlayerTeams.html" class="nav-back">◀ BACK</a>

    <div class="title-row">
        <h1 id="teamTitle">loading...</h1>
        <span class="fight-badge" id="fightBadge" style="display:none">!! IN FIGHT</span>
    </div>

    <div class="team-level-line" id="teamLevel"></div>

    <div id="monsterList" class="loading">loading...</div>

    <div class="fight-actions" id="fightActions"></div>

    <div class="autofight-row" id="autofightRow">
        <span class="autofight-label">AUTO FIGHT</span>
        <button class="autofight-btn" id="btnAutoFight">OFF</button>
    </div>

    <div class="delete-wrap">
        <hr class="sep">
        <button class="btn-danger" id="btnDelete">[ DELETE TEAM ]</button>
    </div>
</div>

<script src="/utils.js"></script>
<script>
    const params = new URLSearchParams(location.search);
    const teamID = params.get('id');
    const from   = params.get('from');   // 'play' or null
    if (!teamID) location.href = '/PlayerTeams.html';

    // Set back link based on entry point
    document.getElementById('backLink').href = from === 'play' ? '/Play.html' : '/PlayerTeams.html';

    let deleteStage = 0;
    let deleteTimer = null;
    let autoFightState = false;

    // ── Load ──────────────────────────────────────────────
    async function load() {
        const res = await postForm('/ViewTeam', { ID: teamID });
        if (!res || !res.ok) { location.href = '/PlayerTeams.html'; return; }
        const team = await res.json();
        render(team);
    }

    // ── Render ────────────────────────────────────────────
    function render(team) {
        document.title = 'ASCII Clash — ' + team.name;
        document.getElementById('teamTitle').textContent = team.name;

        const badge = document.getElementById('fightBadge');
        badge.style.display = team.in_fight ? 'inline-block' : 'none';

        // Total level
        const totalLvl = team.monsters.reduce((s, m) => s + (m ? m.stats.Level : 0), 0);
        document.getElementById('teamLevel').textContent =
            totalLvl > 0 ? 'TOTAL LV: ' + totalLvl : 'NO MONSTERS';

        // AutoFight
        autoFightState = !!team.auto_fight;
        const afBtn = document.getElementById('btnAutoFight');
        afBtn.textContent = autoFightState ? 'ON' : 'OFF';
        afBtn.classList.toggle('on', autoFightState);

        // Monster list
        const list = document.getElementById('monsterList');
        list.className = '';
        list.innerHTML = '';

        // Append from= param to child page links when applicable
        const fromSuffix = from === 'play' ? '&from=play' : '';

        team.monsters.forEach((mon) => {
            const banner = document.createElement('div');

            if (!mon) {
                banner.className = 'monster-banner empty';
                banner.innerHTML = '<span class="empty-slot-text">[ + new monster ]</span>';
                banner.addEventListener('click', () => {
                    location.href = '/CreateMonster.html?teamID=' + teamID + fromSuffix;
                });
            } else {
                banner.className = 'monster-banner';

                const maxHP   = mon.stats.Health;
                const curHP   = mon.current_health;
                const hpPct   = maxHP > 0 ? Math.max(0, Math.min((curHP / maxHP) * 100, 100)) : 0;
                const fillCls = hpPct <= 25 ? 'crit' : hpPct <= 50 ? 'low' : '';

                banner.innerHTML = `
                    <img class="monster-img"
                         src="/images/${encodeURIComponent(mon.type)}.png"
                         alt="${mon.type}"
                         onerror="this.src='/images/NA.png'">
                    <div class="monster-info">
                        <div class="monster-name">${mon.name}</div>
                        <div class="monster-type-lv">${mon.type} · LV.${mon.stats.Level}</div>
                        <div class="hp-row">
                            <div class="hp-label"><span>HP</span><span>${curHP} / ${maxHP}</span></div>
                            <div class="progress-bar">
                                <div class="progress-fill ${fillCls}" style="width:${hpPct}%"></div>
                            </div>
                        </div>
                    </div>
                `;
                banner.addEventListener('click', () => {
                    location.href = '/ViewMonster.html?teamID=' + teamID + '&monsterID=' + mon.ID + fromSuffix;
                });
            }

            list.appendChild(banner);
        });

        // Fight action buttons
        renderFightActions(team);
    }

    // ── Fight action area ─────────────────────────────────
    const fightErr = document.createElement('div');
    fightErr.className = 'msg-error';

    function renderFightActions(team) {
        const wrap = document.getElementById('fightActions');
        wrap.innerHTML = '';
        wrap.appendChild(fightErr);
        hideMsg(fightErr);

        if (team.in_fight) {
            const btn = document.createElement('button');
            btn.className = 'btn-rejoin';
            btn.textContent = '[ REJOIN FIGHT ]';
            btn.addEventListener('click', () => {
                location.href = '/ViewFight.html?fight_id=' + team.fight_id + '&team_id=' + teamID;
            });
            wrap.appendChild(btn);
            return;
        }

        const hasMonsters = team.monsters.some(m => m !== null);
        if (!hasMonsters) return;

        const row = document.createElement('div');
        row.className = 'fight-btn-row';

        const spBtn = document.createElement('button');
        spBtn.className = 'btn-primary';
        spBtn.textContent = '[ VS AI ]';
        spBtn.addEventListener('click', async () => {
            hideMsg(fightErr);
            spBtn.disabled = true;
            const res = await postJSON('/StartFight', [parseInt(teamID), -1]);
            if (!res || !res.ok) {
                const msg = res ? await res.text() : 'Request failed';
                showError(fightErr, msg);
                spBtn.disabled = false;
                return;
            }
            const fightID = await res.text();
            location.href = '/ViewFight.html?fight_id=' + fightID.trim() + '&team_id=' + teamID;
        });

        const mpBtn = document.createElement('button');
        mpBtn.className = 'btn-lobby';
        mpBtn.textContent = '[ LOBBY ]';
        mpBtn.addEventListener('click', () => {
            // Pass back param so Lobby can return here correctly
            const backURL = encodeURIComponent('/ViewTeam.html?id=' + teamID + (from === 'play' ? '&from=play' : ''));
            location.href = '/Lobby.html?team_id=' + teamID + '&back=' + backURL;
        });

        row.appendChild(spBtn);
        row.appendChild(mpBtn);
        wrap.appendChild(row);
    }

    // ── Delete ────────────────────────────────────────────
    const btnDelete = document.getElementById('btnDelete');

    btnDelete.addEventListener('click', async () => {
        if (deleteStage === 0) {
            deleteStage = 1;
            btnDelete.textContent = '[ CONFIRM DELETE? ]';
            btnDelete.classList.add('armed');
            clearTimeout(deleteTimer);
            deleteTimer = setTimeout(() => {
                deleteStage = 0;
                btnDelete.textContent = '[ DELETE TEAM ]';
                btnDelete.classList.remove('armed');
            }, 4000);
        } else {
            clearTimeout(deleteTimer);
            btnDelete.disabled = true;
            const res = await postForm('/DeleteTeam', { ID: teamID });
            if (!res || !res.ok) {
                btnDelete.disabled = false;
                deleteStage = 0;
                btnDelete.textContent = '[ DELETE TEAM ]';
                btnDelete.classList.remove('armed');
                return;
            }
            location.href = from === 'play' ? '/Play.html' : '/PlayerTeams.html';
        }
    });

    // ── AutoFight toggle ──────────────────────────────────
    document.getElementById('btnAutoFight').addEventListener('click', async () => {
        const btn = document.getElementById('btnAutoFight');
        const newVal = autoFightState ? 0 : 1;
        const res = await postForm('/SetAutoFight', { team_ID: teamID, set_to: newVal });
        if (!res || !res.ok) return;
        autoFightState = newVal === 1;
        btn.textContent = autoFightState ? 'ON' : 'OFF';
        btn.classList.toggle('on', autoFightState);
    });

    load();
</script>
</body>
</html>

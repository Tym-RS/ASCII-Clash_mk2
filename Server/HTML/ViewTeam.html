<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Clash — Team</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        /* ── Title row ── */
        .title-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid var(--dim);
            flex-wrap: wrap;
        }

        .title-row h1 {
            margin: 0;
            padding: 0;
            border: none;
            font-size: 0.85rem;
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .title-row h1::after {
            content: none;
        }

        .fight-badge {
            font-size: 0.38rem;
            color: #000;
            background: var(--green);
            padding: 0.3rem 0.45rem;
            letter-spacing: 0.15em;
            white-space: nowrap;
            animation: blink 1.2s step-end infinite;
            flex-shrink: 0;
        }

        /* ── Monster cards ── */
        .monster-banner {
            border: 2px solid var(--dim);
            display: flex;
            align-items: center;
            gap: 0.85rem;
            padding: 0.75rem;
            margin-bottom: 0.6rem;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.4);
            transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
        }

        .monster-banner:hover {
            border-color: var(--green);
            box-shadow: 0 0 12px rgba(0, 255, 65, 0.1);
            background: rgba(0, 122, 31, 0.05);
        }

        .monster-banner:active {
            transform: translate(2px, 2px);
        }

        .monster-banner.empty {
            border: 2px dashed rgba(0, 122, 31, 0.35);
            justify-content: center;
            min-height: 64px;
            opacity: 0.55;
        }

        .monster-banner.empty:hover {
            opacity: 1;
            border-color: var(--green);
        }

        .empty-slot-text {
            font-size: 0.5rem;
            color: var(--dim);
        }

        .monster-img {
            width: 52px;
            height: 52px;
            object-fit: contain;
            image-rendering: pixelated;
            flex-shrink: 0;
        }

        .monster-info {
            flex: 1;
            min-width: 0;
        }

        .monster-name {
            font-size: 0.6rem;
            color: var(--green);
            margin-bottom: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .monster-type-lv {
            font-size: 0.42rem;
            color: var(--dim);
            margin-bottom: 0.4rem;
        }

        /* ── HP bar ── */
        .hp-row {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .hp-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.38rem;
            color: var(--dim);
        }

        .progress-bar {
            height: 6px;
            background: rgba(0, 122, 31, 0.15);
            border: 1px solid rgba(0, 122, 31, 0.3);
        }

        .progress-fill {
            height: 100%;
            background: var(--green);
            transition: width 0.3s ease;
        }

        .progress-fill.low {
            background: var(--yellow, #ffe000);
        }

        .progress-fill.crit {
            background: var(--red);
        }

        /* ── Delete ── */
        .delete-wrap {
            margin-top: 1.5rem;
        }

        .btn-danger {
            width: 100%;
            background: transparent;
            color: rgba(0, 122, 31, 0.45);
            font-family: 'Press Start 2P', monospace;
            font-size: 0.5rem;
            border: 1px solid rgba(0, 122, 31, 0.25);
            padding: 0.75rem;
            cursor: pointer;
            min-height: 48px;
            transition: color 0.15s, border-color 0.15s;
        }

        .btn-danger:hover {
            color: var(--red);
            border-color: var(--red);
        }

        .btn-danger.armed {
            color: var(--red);
            border-color: var(--red);
            animation: blink 0.6s step-end infinite;
        }
    </style>
</head>
<body>
<div class="container">
    <a href="/PlayerTeams.html" class="nav-back">◀ BACK</a>

    <div class="title-row">
        <h1 id="teamTitle">loading...</h1>
        <span class="fight-badge" id="fightBadge" style="display:none">⚔ IN FIGHT</span>
    </div>

    <div id="monsterList" class="loading">loading...</div>

    <div class="delete-wrap">
        <hr class="sep">
        <button class="btn-danger" id="btnDelete">[ DELETE TEAM ]</button>
    </div>
</div>

<script src="/utils.js"></script>
<script>
    const params = new URLSearchParams(location.search);
    const teamID = params.get('id');
    if (!teamID) location.href = '/PlayerTeams.html';

    let deleteStage = 0;
    let deleteTimer = null;

    // ── Load ──────────────────────────────────────────────
    async function load() {
        const res = await postForm('/ViewTeam', {ID: teamID});
        if (!res || !res.ok) {
            location.href = '/PlayerTeams.html';
            return;
        }
        const team = await res.json();
        render(team);
    }

    // ── Render ────────────────────────────────────────────
    function render(team) {
        document.title = 'ASCII Clash — ' + team.name;
        document.getElementById('teamTitle').textContent = team.name;

        const badge = document.getElementById('fightBadge');
        badge.style.display = team.in_fight ? 'inline-block' : 'none';

        const list = document.getElementById('monsterList');
        list.className = '';
        list.innerHTML = '';

        team.monsters.forEach((mon) => {
            const banner = document.createElement('div');

            if (!mon) {
                banner.className = 'monster-banner empty';
                banner.innerHTML = '<span class="empty-slot-text">[ + new monster ]</span>';
                banner.addEventListener('click', () => {
                    location.href = '/CreateMonster.html?teamID=' + teamID;
                });
            } else {
                banner.className = 'monster-banner';

                const maxHP = mon.stats.Health;
                const curHP = mon.current_health;
                const hpPct = maxHP > 0 ? Math.max(0, Math.min((curHP / maxHP) * 100, 100)) : 0;
                const fillCls = hpPct <= 25 ? 'crit' : hpPct <= 50 ? 'low' : '';

                banner.innerHTML = `
            <img class="monster-img"
                 src="/images/${encodeURIComponent(mon.type)}.png"
                 alt="${mon.type}"
                 onerror="this.src='/images/NA.png'">
            <div class="monster-info">
              <div class="monster-name">${mon.name}</div>
              <div class="monster-type-lv">${mon.type} · LV.${mon.stats.Level}</div>
              <div class="hp-row">
                <div class="hp-label">
                  <span>HP</span>
                  <span>${curHP} / ${maxHP}</span>
                </div>
                <div class="progress-bar">
                  <div class="progress-fill ${fillCls}" style="width:${hpPct}%"></div>
                </div>
              </div>
            </div>
          `;
                banner.addEventListener('click', () => {
                    location.href = '/ViewMonster.html?teamID=' + teamID + '&monsterID=' + mon.ID
                });
            }

            list.appendChild(banner);
        });
    }

    // ── Two-click delete ──────────────────────────────────
    const btnDelete = document.getElementById('btnDelete');

    btnDelete.addEventListener('click', async () => {
        if (deleteStage === 0) {
            deleteStage = 1;
            btnDelete.textContent = '[ CONFIRM DELETE? ]';
            btnDelete.classList.add('armed');
            clearTimeout(deleteTimer);
            deleteTimer = setTimeout(() => {
                deleteStage = 0;
                btnDelete.textContent = '[ DELETE TEAM ]';
                btnDelete.classList.remove('armed');
            }, 4000);
        } else {
            clearTimeout(deleteTimer);
            btnDelete.disabled = true;
            const res = await postForm('/DeleteTeam', {ID: teamID});
            if (!res || !res.ok) {
                const msg = res ? await res.text() : 'Request failed';
                btnDelete.disabled = false;
                deleteStage = 0;
                btnDelete.textContent = '[ DELETE TEAM ]';
                btnDelete.classList.remove('armed');
                return;
            }
            location.href = '/PlayerTeams.html';
        }
    });

    load();
</script>
</body>
</html>

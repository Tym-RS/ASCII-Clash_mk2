<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASCII Clash</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    /* ── Retro score cabinet ── */
    .score-cabinet {
      margin-bottom: 1.75rem;
      border: 2px solid var(--dim);
      background: #000;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* subtle scanlines inside cabinet */
    .score-cabinet::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 3px,
        rgba(0, 255, 65, 0.025) 3px, rgba(0, 255, 65, 0.025) 4px
      );
      pointer-events: none;
      z-index: 1;
    }

    .cabinet-header {
      background: var(--dim);
      padding: 0.35rem 0.5rem;
      font-size: 0.45rem;
      color: #000;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      position: relative;
      z-index: 2;
    }

    .cabinet-body {
      padding: 0.85rem 1rem 0.6rem;
      position: relative;
      z-index: 2;
    }

    .score-number {
      font-size: 1.5rem;
      color: var(--green);
      text-shadow:
        0 0 8px rgba(0, 255, 65, 1),
        0 0 20px rgba(0, 255, 65, 0.6),
        0 0 45px rgba(0, 255, 65, 0.25);
      letter-spacing: 0.18em;
      display: block;
      margin-bottom: 0.25rem;
    }

    .score-sub {
      font-size: 0.38rem;
      color: var(--dim);
      letter-spacing: 0.25em;
    }

    .cabinet-footer {
      font-size: 0.38rem;
      color: var(--dim);
      padding: 0.3rem 0.5rem;
      border-top: 1px solid rgba(0, 122, 31, 0.25);
      letter-spacing: 0.15em;
      animation: blink 1.3s step-end infinite;
      position: relative;
      z-index: 2;
    }

    /* ── Menu buttons ── */
    .menu-btn {
      width: 100%;
      background: transparent;
      color: var(--text);
      font-family: 'Press Start 2P', monospace;
      font-size: 0.65rem;
      border: 2px solid var(--dim);
      padding: 1rem 1.1rem;
      cursor: pointer;
      min-height: 56px;
      margin-bottom: 0.5rem;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      box-shadow: 3px 3px 0 rgba(0, 122, 31, 0.25);
      transition: border-color 0.15s, color 0.15s, box-shadow 0.15s;
    }

    .menu-btn .arrow {
      color: var(--dim);
      font-size: 0.5rem;
      transition: color 0.15s, transform 0.15s;
    }

    .menu-btn:hover {
      border-color: var(--green);
      color: var(--green);
      box-shadow: 3px 3px 0 var(--dim), 0 0 14px rgba(0, 255, 65, 0.08);
    }

    .menu-btn:hover .arrow {
      color: var(--green);
      transform: translateX(3px);
    }

    .menu-btn:active {
      transform: translate(3px, 3px);
      box-shadow: none;
    }

    .logout-btn {
      width: 100%;
      background: transparent;
      color: rgba(0, 122, 31, 0.45);
      font-family: 'Press Start 2P', monospace;
      font-size: 0.5rem;
      border: 1px solid rgba(0, 122, 31, 0.25);
      padding: 0.6rem;
      cursor: pointer;
      min-height: 44px;
      transition: color 0.15s, border-color 0.15s;
    }

    .logout-btn:hover {
      color: var(--red);
      border-color: var(--red);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="greeting">loading...</h1>

    <div class="score-cabinet">
      <div class="cabinet-header">── YOUR SCORE ──</div>
      <div class="cabinet-body">
        <span class="score-number" id="scoreNum">00000000</span>
        <div class="score-sub">TOTAL POINTS</div>
      </div>
      <div class="cabinet-footer">▶ YOU'RE WONDERFUL ◀</div>
    </div>

    <button class="menu-btn" id="btnSingle">
      <span class="arrow">▶</span>PLAY
    </button>
    <button class="menu-btn" id="btnLeader">
      <span class="arrow">▶</span>LEADERBOARD
    </button>
    <button class="menu-btn" id="btnAbout">
      <span class="arrow">▶</span>ABOUT
    </button>

    <hr class="sep">
    <button class="logout-btn" id="btnLogout">[ LOGOUT ]</button>
  </div>

  <script src="/utils.js"></script>
  <script>
    async function init() {
      const res = await post('/about/me');
      if (!res) return;
      if (!res.ok) { window.location.href = '/index.html'; return; }

      const data = await res.json();
      document.getElementById('greeting').textContent = `hello, ${data.Username}!`;
      document.getElementById('scoreNum').textContent  = String(data.Score).padStart(8, '0');
      document.title = `ASCII Clash — ${data.Username}`;
    }

    document.getElementById('btnSingle').onclick = () => location.href = '/team.html';
    document.getElementById('btnLeader').onclick = () => location.href = '/leaderboard.html';
    document.getElementById('btnAbout').onclick  = () => location.href = '/about.html';
    document.getElementById('btnLogout').onclick = async () => {
      await post('/logout');
      location.href = '/index.html';
    };

    init();
  </script>
</body>
</html>

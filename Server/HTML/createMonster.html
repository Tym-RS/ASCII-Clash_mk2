<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASCII Clash — New Monster</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <a href="/team.html" class="nav-back">◀ BACK</a>
    <h1>New Monster</h1>

    <div class="msg-error" id="err"></div>

    <div class="field">
      <label for="monsterName">Name</label>
      <input type="text" id="monsterName" name="monsterName"
             spellcheck="false" maxlength="32" autocomplete="off">
    </div>

    <div class="section-label" style="margin-bottom:0.5rem">Type</div>

    <div class="carousel-row">
      <button class="btn-small" id="btnPrev" aria-label="Previous type">◀</button>
      <div class="carousel-wrap" id="carouselWrap">
        <div class="loading">loading...</div>
      </div>
      <button class="btn-small" id="btnNext" aria-label="Next type">▶</button>
    </div>

    <div class="carousel-dots" id="carouselDots"></div>

    <button class="btn-primary" id="btnCreate">[ CREATE ]</button>
  </div>

  <script src="/utils.js"></script>
  <script>
    const errBox   = document.getElementById('err');
    const btnPrev  = document.getElementById('btnPrev');
    const btnNext  = document.getElementById('btnNext');
    const wrap     = document.getElementById('carouselWrap');
    const dotsEl   = document.getElementById('carouselDots');
    const btnCreate= document.getElementById('btnCreate');

    let types  = [];   // [{ name: string, desc: string }]
    let idx    = 0;
    let locked = false;

    // ── Load monster types ─────────────────────────────────
    async function loadTypes() {
      const res = await post('/about/game?key=Monsters');
      if (!res || !res.ok) return;
      const data = await res.json();
      types = Object.entries(data).map(([name, desc]) => ({ name, desc }));
      if (types.length === 0) return;

      // Hide nav buttons if only one type
      const showNav = types.length > 1;
      btnPrev.style.visibility = showNav ? 'visible' : 'hidden';
      btnNext.style.visibility = showNav ? 'visible' : 'hidden';

      renderCard(idx, null);
      buildDots();
    }

    // ── Render the current card (with optional entrance animation) ──
    function renderCard(i, animIn) {
      wrap.innerHTML = '';
      const card = document.createElement('div');
      card.className = 'carousel-card';
      card.innerHTML = `
        <img class="carousel-img"
             src="/images/${encodeURIComponent(types[i].name)}.png"
             alt="${types[i].name}"
             onerror="this.src='/images/NA.png'">
        <div class="carousel-name">${types[i].name}</div>
        <div class="carousel-desc">${types[i].desc}</div>
      `;
      if (animIn) {
        card.style.animation = `${animIn} 160ms ease forwards`;
      }
      wrap.appendChild(card);
      updateDotActive();
    }

    // ── Dot indicators ─────────────────────────────────────
    function buildDots() {
      dotsEl.innerHTML = '';
      types.forEach((_, i) => {
        const dot = document.createElement('button');
        dot.className = 'carousel-dot' + (i === idx ? ' active' : '');
        dot.setAttribute('aria-label', `Select type ${i + 1}`);
        dot.addEventListener('click', () => {
          if (locked || i === idx) return;
          const dir = i > idx ? 1 : -1;
          idx = i;
          buildDots();
          animateTransition(dir);
        });
        dotsEl.appendChild(dot);
      });
    }

    function updateDotActive() {
      dotsEl.querySelectorAll('.carousel-dot')
        .forEach((d, i) => d.classList.toggle('active', i === idx));
    }

    // ── Slide animation ─────────────────────────────────────
    // dir > 0 = forward (→): out-left, in-right
    // dir < 0 = backward (←): out-right, in-left
    function animateTransition(dir) {
      if (locked) return;
      locked = true;

      const outAnim = dir > 0 ? 'slideOutLeft'  : 'slideOutRight';
      const inAnim  = dir > 0 ? 'slideInRight'  : 'slideInLeft';

      const card = wrap.querySelector('.carousel-card');
      if (card) {
        card.style.animation = `${outAnim} 160ms ease forwards`;
      }

      setTimeout(() => {
        renderCard(idx, inAnim);
        setTimeout(() => { locked = false; }, 160);
      }, 160);
    }

    // ── Nav buttons ─────────────────────────────────────────
    btnPrev.addEventListener('click', () => {
      if (locked || types.length < 2) return;
      idx = (idx - 1 + types.length) % types.length;
      buildDots();
      animateTransition(-1);
    });

    btnNext.addEventListener('click', () => {
      if (locked || types.length < 2) return;
      idx = (idx + 1) % types.length;
      buildDots();
      animateTransition(1);
    });

    // ── Create monster ───────────────────────────────────────
    btnCreate.addEventListener('click', async () => {
      hideMsg(errBox);

      const name = document.getElementById('monsterName').value.trim();
      if (!name) { showError(errBox, 'Please enter a name'); return; }
      if (types.length === 0) { showError(errBox, 'No types loaded yet'); return; }

      const type = types[idx].name;
      btnCreate.disabled = true;

      const res = await postForm('/createMonster', { name, type });
      if (!res) { btnCreate.disabled = false; return; }

      if (res.ok) {
        // Fetch all monsters to find the new one's ID
        const listRes = await post('/getMonster');
        if (listRes && listRes.ok) {
          const monsters = await listRes.json();
          const found = monsters.find(m => m && m.name === name && m.type === type);
          if (found) {
            location.href = `/viewMonster.html?id=${found.id}`;
            return;
          }
        }
        location.href = '/team.html'; // fallback
      } else {
        const msg = await res.text();
        showError(errBox, msg || 'Failed to create monster');
        btnCreate.disabled = false;
      }
    });

    loadTypes();
  </script>
</body>
</html>

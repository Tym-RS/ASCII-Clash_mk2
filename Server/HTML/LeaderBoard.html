<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASCII Clash — Leaderboard</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    /* ── Arcade frame ── */
    .arcade-frame {
      border: 2px solid var(--dim);
      background: #000;
      text-align: center;
      margin-bottom: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    .arcade-frame::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
              0deg, transparent, transparent 3px,
              rgba(0, 255, 65, 0.025) 3px, rgba(0, 255, 65, 0.025) 4px
      );
      pointer-events: none;
    }

    .arcade-top {
      background: var(--dim);
      padding: 0.3rem 0.5rem;
      font-size: 0.4rem;
      color: #000;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
    }

    .arcade-body {
      padding: 0.75rem 1rem 0.5rem;
      position: relative;
      z-index: 1;
    }

    .arcade-body h1 {
      font-size: 1rem;
      letter-spacing: 0.15em;
      margin: 0;
      padding: 0;
      border: none;
    }

    .arcade-body h1::after { content: none; }

    .arcade-tagline {
      font-size: 0.4rem;
      color: var(--dim);
      letter-spacing: 0.15em;
      margin-top: 0.3rem;
      display: block;
    }

    .arcade-foot {
      font-size: 0.38rem;
      color: var(--dim);
      padding: 0.3rem 0.5rem;
      border-top: 1px solid rgba(0, 122, 31, 0.25);
      letter-spacing: 0.2em;
      animation: blink 1.4s step-end infinite;
      position: relative;
      z-index: 1;
    }

    /* ── You-status bar ── */
    .you-status {
      font-size: 0.45rem;
      color: var(--green);
      background: rgba(0, 255, 65, 0.06);
      border: 1px solid var(--dim);
      padding: 0.45rem 0.6rem;
      margin-bottom: 1rem;
      text-align: center;
      display: none;
    }

    /* ── Table header ── */
    .lb-head {
      display: flex;
      gap: 0.5rem;
      padding: 0.3rem 0.6rem;
      font-size: 0.38rem;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      border-bottom: 1px solid rgba(0, 122, 31, 0.3);
      margin-bottom: 0.35rem;
    }

    .lb-rank  { min-width: 2rem; flex-shrink: 0; }
    .lb-name  { flex: 1; }
    .lb-score { min-width: 5rem; text-align: right; flex-shrink: 0; }

    /* ── Rank rows (from style.css base, extended here) ── */
    .lb-rank-row {
      display: flex;
      gap: 0.5rem;
      padding: 0.4rem 0.6rem;
      font-size: 0.45rem;
      border-bottom: 1px solid rgba(0, 122, 31, 0.1);
      align-items: center;
    }

    .lb-rank-row.rank-1 { color: #ffd700; border-color: rgba(255, 215, 0, 0.2); }
    .lb-rank-row.rank-2 { color: #c0c0c0; border-color: rgba(192, 192, 192, 0.2); }
    .lb-rank-row.rank-3 { color: #cd7f32; border-color: rgba(205, 127, 50, 0.2); }

    .lb-rank-row.current-user {
      background: rgba(0, 255, 65, 0.06);
      border-color: rgba(0, 255, 65, 0.25);
    }

    .lb-you-tag {
      font-size: 0.35rem;
      color: var(--green);
      margin-left: 0.4rem;
      opacity: 0.75;
    }

    /* ── Load more ── */
    .load-more-wrap {
      margin-top: 1rem;
    }
  </style>
</head>
<body>
<div class="container">
  <a href="/Home.html" class="nav-back">◀ BACK</a>

  <div class="arcade-frame">
    <div class="arcade-top">── HALL OF FAME ──</div>
    <div class="arcade-body">
      <h1>TOP SCORES</h1>
      <span class="arcade-tagline">-- TOP PLAYERS --</span>
    </div>
    <div class="arcade-foot" id="splashText">▶ LOADING... ◀</div>
  </div>

  <div class="you-status" id="youStatus"></div>

  <div class="lb-head">
    <span class="lb-rank">#</span>
    <span class="lb-name">PLAYER</span>
    <span class="lb-score">SCORE</span>
  </div>

  <div id="lbList" class="loading">loading...</div>

  <div class="load-more-wrap" id="loadMoreWrap" style="display:none">
    <button class="btn-primary" id="btnLoadMore">[ SHOW 50 ]</button>
  </div>
</div>

<script src="/utils.js"></script>
<script>
  const LIMITS    = [25, 50, 100, -1];
  const LABELS    = ['[ SHOW 50 ]', '[ SHOW 100 ]', '[ SHOW ALL ]'];
  let limitIndex  = 0;   // current index into LIMITS (we start loaded at LIMITS[0])
  let me          = null;

  async function init() {
    // Fetch leaderboard + current user + splash text in parallel
    const [lbRes, meRes, splashRes] = await Promise.all([
      postForm('/Leaderboard', { limit: LIMITS[0] }),
      post('/ViewMe'),
      post('/SplashText'),
    ]);

    if (splashRes && splashRes.ok) {
      const t = await splashRes.text();
      document.getElementById('splashText').textContent = '▶ ' + t + ' ◀';
    }

    if (meRes && meRes.ok) {
      const meData = await meRes.json();
      me = meData.Username;
    }

    const rows = (lbRes && lbRes.ok) ? await lbRes.json() : [];
    render(rows, LIMITS[0]);
  }

  async function loadMore() {
    limitIndex++;
    const limit = LIMITS[limitIndex];
    const res = await postForm('/Leaderboard', { limit });
    if (!res || !res.ok) return;
    const rows = await res.json();
    render(rows, limit);
  }

  function render(rows, limit) {
    const list       = document.getElementById('lbList');
    const youStatus  = document.getElementById('youStatus');
    const moreWrap   = document.getElementById('loadMoreWrap');
    const btnMore    = document.getElementById('btnLoadMore');

    list.className = '';
    list.innerHTML = '';

    if (rows.length === 0) {
      list.innerHTML = `
        <div style="text-align:center;font-size:0.5rem;color:var(--dim);padding:1.5rem 0">
          NO SCORES YET
        </div>`;
      moreWrap.style.display = 'none';
      return;
    }

    let myRank = null, myScore = null;

    rows.forEach((entry, i) => {
      const rank = i + 1;
      const isMe = me && entry.username === me;
      if (isMe) { myRank = rank; myScore = entry.score; }

      const row = document.createElement('div');
      row.className = 'lb-rank-row'
              + (rank <= 3 ? ' rank-' + rank : '')
              + (isMe ? ' current-user' : '');

      const youTag = isMe ? '<span class="lb-you-tag">&lt;-- you</span>' : '';

      row.innerHTML = `
        <span class="lb-rank">#${rank}</span>
        <span class="lb-name">${entry.username}${youTag}</span>
        <span class="lb-score">${String(entry.score).padStart(6, '0')}</span>
      `;
      list.appendChild(row);
    });

    // You-status bar
    if (myRank !== null) {
      youStatus.textContent  = '> you are #' + myRank + ' with ' + myScore + ' points';
      youStatus.style.display = 'block';
    }

    // Load more button
    // Hide if we just loaded everything (limit === -1) or returned fewer rows than requested
    const allLoaded = limit === -1 || rows.length < LIMITS[limitIndex];
    if (allLoaded || limitIndex >= LIMITS.length - 1) {
      moreWrap.style.display = 'none';
    } else {
      moreWrap.style.display = 'block';
      btnMore.textContent = LABELS[limitIndex];
    }
  }

  document.getElementById('btnLoadMore').addEventListener('click', loadMore);

  init();
</script>
</body>
</html>
